name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, core, product-* ]
  pull_request:
    branches: [ main, develop ]

env:
  BUILD_TYPE: Release
  CMAKE_VERSION: 3.15

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        config: [Release, Debug]
        
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        
    - name: Setup CMake
      uses: jwlawson/actions-setup-cmake@v1.14
      with:
        cmake-version: '3.31'
        
    - name: Setup MSVC
      uses: microsoft/setup-msbuild@v1.3
      
    - name: Configure CMake
      run: |
        cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=${{ matrix.config }}
        
    - name: Build
      run: |
        cmake --build build --config ${{ matrix.config }} --parallel
        
    - name: Test
      working-directory: build
      run: |
        ctest --config ${{ matrix.config }} --output-on-failure
        
    - name: Package artifacts
      if: matrix.config == 'Release'
      run: |
        cmake --install build --prefix install --config Release
        
    - name: Upload build artifacts
      if: matrix.config == 'Release'
      uses: actions/upload-artifact@v4
      with:
        name: windows-build-${{ github.sha }}
        path: |
          install/
          build/**/*.vst3
          build/**/*.exe

  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        config: [Release, Debug]
        
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        
    - name: Setup CMake
      uses: jwlawson/actions-setup-cmake@v1.14
      with:
        cmake-version: '3.31'
        
    - name: Configure CMake
      run: |
        cmake -B build -G Xcode -DCMAKE_BUILD_TYPE=${{ matrix.config }}
        
    - name: Build
      run: |
        cmake --build build --config ${{ matrix.config }} --parallel
        
    - name: Test
      working-directory: build
      run: |
        ctest --config ${{ matrix.config }} --output-on-failure
        
    - name: Package artifacts
      if: matrix.config == 'Release'
      run: |
        cmake --install build --prefix install --config Release
        
    - name: Upload build artifacts
      if: matrix.config == 'Release'
      uses: actions/upload-artifact@v4
      with:
        name: macos-build-${{ github.sha }}
        path: |
          install/
          build/**/*.vst3
          build/**/*.component
          build/**/*.app

  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        config: [Release, Debug]
        
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libasound2-dev \
          libjack-jackd2-dev \
          ladspa-dev \
          libcurl4-openssl-dev \
          libfreetype6-dev \
          libx11-dev \
          libxcomposite-dev \
          libxcursor-dev \
          libxcursor-dev \
          libxext-dev \
          libxinerama-dev \
          libxrandr-dev \
          libxrender-dev \
          libwebkit2gtk-4.0-dev \
          libglu1-mesa-dev \
          mesa-common-dev
          
    - name: Setup CMake
      uses: jwlawson/actions-setup-cmake@v1.14
      with:
        cmake-version: '3.31'
        
    - name: Configure CMake
      run: |
        cmake -B build -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=${{ matrix.config }}
        
    - name: Build
      run: |
        cmake --build build --config ${{ matrix.config }} --parallel
        
    - name: Test
      working-directory: build
      run: |
        ctest --config ${{ matrix.config }} --output-on-failure
        
    - name: Package artifacts
      if: matrix.config == 'Release'
      run: |
        cmake --install build --prefix install --config Release
        
    - name: Upload build artifacts
      if: matrix.config == 'Release'
      uses: actions/upload-artifact@v4
      with:
        name: linux-build-${{ github.sha }}
        path: |
          install/
          build/**/*.vst3
          build/**/*.so

  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          windows-build-*/
          macos-build-*/
          linux-build-*/
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}